name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Tag Name
        id: release_tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v0.1.$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create .env file
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "VITE_FIREBASE_DATABASE_URL=${{ secrets.VITE_FIREBASE_DATABASE_URL }}" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env
          echo "VITE_GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY }}" >> .env
          echo "VITE_ONESIGNAL_APP_ID=${{ secrets.VITE_ONESIGNAL_APP_ID }}" >> .env
          echo "VITE_ONESIGNAL_REST_API_KEY=${{ secrets.VITE_ONESIGNAL_REST_API_KEY }}" >> .env

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Sign Release APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-apks
          cp "${{ steps.sign_apk.outputs.signedReleaseFile }}" "release-apks/Kasseo-${{ steps.release_tag.outputs.tag }}.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kasseo-${{ steps.release_tag.outputs.tag }}
          path: release-apks/*.apk

      - name: Build Release Notes
        id: release_notes
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          {
            echo "## Kasseo ${TAG}"
            echo ""
            echo "### Downloads"
            echo ""
            echo "| File | Size | SHA256 |"
            echo "|------|------|--------|"
            for f in release-apks/*.apk; do
              name=$(basename "$f")
              size=$(du -h "$f" | cut -f1)
              sha=$(sha256sum "$f" | cut -d' ' -f1)
              short_sha="${sha:0:12}…"
              echo "| \`${name}\` | ${size} | \`${short_sha}\` |"
            done
            echo ""
            echo "> Full SHA256 checksum is also listed in \`checksums.txt\`, attached below."
            echo ""
            echo "### Build Info"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Workflow run: [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo ""
            echo "---"
            echo ""
            echo "### Changelog"
          } > release-notes.md

          # Full checksums file as a separate release asset
          sha256sum release-apks/*.apk | sed 's| release-apks/| |' > checksums.txt

          echo "notes_path=release-notes.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Kasseo ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          body_path: ${{ steps.release_notes.outputs.notes_path }}
          generate_release_notes: true
          files: |
            release-apks/*.apk
            checksums.txt